<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopZone - Modern responsive e-commerce product catalog"
    >

    <title>ShopZone | Product Catalog</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-container">

            <a href="#home" class="logo">
                Shop<span>Zone</span>
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open navigation menu"
            >
                ☰
            </button>

            <nav id="navMenu">

                <a href="#home" class="nav-link">
                    Home
                </a>

                <a href="#products" class="nav-link">
                    Products
                </a>

                <a href="#about" class="nav-link">
                    About
                </a>

                <a href="#cart" class="cart-link">
                    🛒 Cart
                    <span id="cartCount">0</span>
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main id="app">

        <!-- JavaScript loads all pages here -->

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-container">

            <div>
                <h2>Shop<span>Zone</span></h2>

                <p>
                    Simple. Smart. Reliable shopping.
                </p>
            </div>

            <div>
                <h3>Quick Links</h3>

                <a href="#home">Home</a>
                <a href="#products">Products</a>
                <a href="#about">About</a>
            </div>

            <div>
                <h3>Contact</h3>

                <p>support@shopzone.com</p>
                <p>+91 98765 43210</p>
            </div>

        </div>

        <div class="footer-bottom">

            <p>
                © 2026 ShopZone. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
